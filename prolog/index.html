<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Выживи в теле Наруто</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Cousine:wght@400;700&family=Rubik+Dirt&family=Rubik+Mono+One&family=Russo+One&display=swap">
<style>
/* Layout: 3D-сцена сверху (на телефоне) или во весь экран (на компьютере), текст на листке ксерокса, приклеенном скотчем */
:root{
  --night:#0f0d12;      /* ночь, фон под сценой */
  --paper:#ece6da;      /* ксерокс */
  --ink:#141114;        /* тонер */
  --hot:#ff3d9a;        /* маркер */
  --orange:#f08a2c;     /* куртка Джирайи */
  --tape:rgba(240,232,200,.72);
  --muted:#8c8590;
  --f-cut:"Rubik Mono One","Russo One",Impact,sans-serif;
  --f-type:"Cousine","Courier New",monospace;
  --f-hand:"Caveat","Comic Sans MS",cursive;
  --f-dirt:"Rubik Dirt","Rubik Mono One",Impact,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--paper);font-family:var(--f-type);font-size:16px;line-height:1.55;overflow:hidden}
#app{position:relative;height:100%;display:grid;grid-template-rows:minmax(200px,44%) 1fr}
#stage{position:relative;min-height:0}
#stage canvas{display:block;width:100%;height:100%}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
#place{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:12px;font-family:var(--f-hand);font-size:22px;color:var(--paper);transform:rotate(-2deg);text-shadow:0 2px 0 #000;pointer-events:none}
#panelWrap{min-height:0;overflow-y:auto;padding-block:14px 22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(#0f0d12,#16131a)}
.sheet{position:relative;background:var(--paper);color:var(--ink);padding:22px 20px 18px;max-width:640px;margin:0 auto;box-shadow:3px 4px 0 rgba(0,0,0,.6);transform:rotate(-.4deg)}
.sheet::before,.sheet::after{content:"";position:absolute;top:-10px;width:86px;height:22px;background:var(--tape)}
.sheet::before{left:18px;transform:rotate(-6deg)}
.sheet::after{right:22px;transform:rotate(5deg)}
.sheet p{margin:0 0 12px;max-width:62ch}
.sheet p.pre{color:#5b5560;font-style:italic}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.opt{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;background:var(--ink);color:var(--paper);font-family:var(--f-type);font-size:15.5px;line-height:1.35;padding:11px 14px 11px 38px;position:relative;transition:transform .12s}
.opt::before{content:attr(data-k);position:absolute;left:12px;top:11px;font-family:var(--f-cut);font-size:13px;color:var(--hot)}
.opt:hover{transform:translateX(4px) rotate(-.4deg)}
.opt:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
.opt.struck{text-decoration:line-through;text-decoration-color:var(--hot);text-decoration-thickness:3px;color:#9a929e}
.opt.picked{background:var(--hot);color:var(--ink)}
.opt.picked::before{color:var(--ink)}
.opt[disabled]{pointer-events:none}
.found{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.found li{list-style:none;font-size:15px;padding:8px 10px;border:2px dashed var(--ink);opacity:0;transform:translateY(6px);transition:all .5s}
.found li.show{opacity:1;transform:none}
.found li.worst{background:var(--ink);color:var(--paper);border-style:solid}
.name-echo{font-family:var(--f-hand);font-size:30px;color:var(--hot);min-height:40px;margin:4px 0 0}
.ransom{display:flex;flex-wrap:wrap;gap:6px 4px;line-height:1;margin:0 0 14px}
.ransom span{display:inline-block;font-size:clamp(26px,7vw,46px);padding:.08em .14em .02em}
.r1{font-family:var(--f-cut);background:var(--ink);color:var(--paper);transform:rotate(-3deg)}
.r2{font-family:var(--f-dirt);background:var(--orange);color:var(--ink);transform:rotate(2deg)}
.r3{font-family:"Russo One",var(--f-cut);background:var(--paper);color:var(--ink);border:2px solid var(--ink);transform:rotate(-1deg)}
.r4{font-family:var(--f-cut);background:var(--hot);color:var(--ink);transform:rotate(3deg)}
.hand{font-family:var(--f-hand);font-size:24px;color:var(--hot);transform:rotate(-2deg);display:inline-block;margin:0 0 10px}
.warn{display:flex;gap:12px;align-items:flex-start;font-size:13.5px;margin:6px 0 4px}
.warn b{font-family:var(--f-cut);font-weight:400;background:var(--hot);color:var(--ink);padding:2px 8px;transform:rotate(-4deg);flex:none}
.tag{display:inline-block;font-family:var(--f-cut);font-size:12px;letter-spacing:.06em;padding:3px 9px 1px;margin:0 0 12px;transform:rotate(-1.5deg)}
.tag.canon{background:var(--orange);color:var(--ink)}
.tag.alt{background:var(--ink);color:var(--paper)}
.endtitle{font-family:var(--f-dirt);font-size:clamp(30px,8vw,52px);line-height:1;margin:0 0 10px;color:var(--ink);text-wrap:balance}
.help{font-size:13px;border-top:2px solid var(--ink);padding-top:10px;margin-top:14px;color:#3a343c}
.help .num{font-weight:700;user-select:all}
.log{margin:14px 0 0;padding:0;display:grid;gap:4px}
.log li{list-style:none;font-size:14px}
.log li.got::before{content:"✕ ";color:var(--hot);font-weight:700}
.log li.no{color:#8a838d}
.log li.no::before{content:"· ";}
.savebox{margin-top:14px;padding:10px 12px;border:2px dashed var(--ink)}
.savebox code{display:block;font-family:var(--f-type);font-size:12px;word-break:break-all;user-select:all;background:var(--ink);color:var(--paper);padding:6px 8px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.ghost{all:unset;cursor:pointer;font-family:var(--f-type);font-weight:700;font-size:14px;border:2px solid var(--ink);padding:9px 14px}
.ghost:focus-visible{outline:3px solid var(--hot)}
@media (min-width:900px){
  #app{grid-template-rows:1fr;grid-template-columns:1fr minmax(380px,460px)}
  #panelWrap{display:flex;align-items:center;padding-block:40px}
  .sheet{width:100%}
}
@media (prefers-reduced-motion:reduce){.opt,.found li{transition:none}}
</style>

</head>

</div>

 b5:{stage:"bar_eyes",text:()=>["— Тебе нужны деньги или удовольствие? — спрашивают над ухом, низко и очень спокойно, откуда-то из-под музыки."],

/* ================= UI ================= */
const sheet=document.getElementById("sheet");
const placeEl=document.getElementById("place");
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
let pendingPre=null;

function startScreen(){
  setStage("bar_table");placeEl.textContent="";
  const got=store.get("endings",{});
  const n=Object.keys(got).length;
  sheet.innerHTML=`
   <div class="ransom"><span class="r1">ВЫЖИВИ</span><span class="r3">в теле</span><span class="r2">НАРУТО</span></div>

   <p class="warn"><b>18+</b><span>В игре есть самоповреждения, насилие и алкоголь. Без подробностей, но тяжело.</span></p>

function go(id){
  if(id.startsWith("E:")) return ending(id.slice(2));
  S.node=id;const n=N[id];
  setStage(n.stage,n.fire);
  if(n.place) placeEl.textContent=n.place;
  const paras=n.text(S).filter(Boolean);
  let h="";
  if(pendingPre){h+=`<p class="pre">${esc(pendingPre)}</p>`;pendingPre=null}
  h+=paras.map(p=>`<p>${esc(p)}</p>`).join("");
  if(n.type==="search") h+=`<ul class="found" id="found"></ul><p id="after" hidden>${esc(n.after)}</p>`;
  if(n.type==="name") h+=`<p class="name-echo" id="echo"></p>`;
  h+=`<div class="choices" id="ch"></div>`;
  sheet.innerHTML=h;
  document.getElementById("panelWrap").scrollTop=0;
  const box=document.getElementById("ch");
  const list=typeof n.ch==="function"?n.ch(S):n.ch;
  if(n.type==="search"){
    let i=0;const ul=document.getElementById("found");
    const b=mkBtn("?","Поискать внутри себя");
    b.onclick=()=>{
      const li=document.createElement("li");li.textContent=n.items[i];
      if(i===n.items.length-1) li.className="worst";
      ul.appendChild(li);requestAnimationFrame(()=>li.classList.add("show"));
      i++;b.textContent=i<n.items.length?"Искать дальше, до самых углов":"";
      if(i>=n.items.length){b.remove();document.getElementById("after").hidden=false;setPose("naruto","look_down");renderChoices(box,list)}
    };
    box.appendChild(b);return;
  }
  if(n.type==="name"){
    let c=0;const echo=document.getElementById("echo");
    const b=mkBtn("✎","Курама");
    b.onclick=()=>{c++;echo.textContent=Array(c).fill("Курама.").join(" ");if(c>=3){b.remove();renderChoices(box,list)}};
    box.appendChild(b);return;
  }
  renderChoices(box,list);
}
function mkBtn(k,t){const b=document.createElement("button");b.className="opt";b.dataset.k=k;b.textContent=t;return b}
function renderChoices(box,list){
  list.forEach((c,i)=>{
    const b=mkBtn(String.fromCharCode(1040+i),c.t);
    b.onclick=()=>choose(c,b,box);
    box.appendChild(b);
  });
  const f=box.querySelector(".opt");if(f&&matchMedia("(min-width:900px)").matches)f.focus({preventScroll:true});
}
function choose(c,b,box){
  box.querySelectorAll(".opt").forEach(x=>x.disabled=true);
  if(c.fx) for(const k in c.fx) S[k]+=c.fx[k];
  if(c.set) Object.assign(S,c.set);
  pendingPre=c.pre||null;
  const delay=c.strike?1100:260;
  if(c.strike){box.querySelectorAll(".opt").forEach(x=>x.classList.add("struck"));b.classList.add("picked")}
  else b.classList.add("picked");
  setTimeout(()=>go(c.to),delay);
}

function times(n){if(!n)return "ни разу";const a=n%10,b=n%100;return n+" "+((a>=2&&a<=4&&(b<12||b>14))?"раза":"раз")}
function ending(key){
  if(key==="fire"){
    const loops=store.get("loops",0)+1;store.set("loops",loops);
    if(loops>=3) key="loop";
  }
  const E=ENDINGS[key],T=END_TEXT[key](S);
  const got=store.get("endings",{});got[key]=1;store.set("endings",got);
  /* сохранение пути для следующих частей */
  const save={v:1,part:"prolog",end:key,warm:S.warm,truth:S.truth,own:S.own,age15:S.age15?1:0,fire:(key==="fire"||key==="loop")?1:0,saidNo:S.saidNo?1:0,loops:store.get("loops",0)};
  store.set("save",save);
  const code="SN-"+btoa(JSON.stringify(save)).replace(/=+$/,"");
  setStage(T.stage,T.fire);
  setPose("naruto",{fire:"glow",loop:"glow",nofire:"walk",twenty:"slump",spofford:"look_up"}[key]);
  const pre=pendingPre?`<p class="pre">${esc(pendingPre)}</p>`:"";pendingPre=null;
  const log=Object.entries(ENDINGS).map(([k,e])=>got[k]?`<li class="got">${e.title}</li>`:`<li class="no">${e.secret?"скрытая концовка":"???"}</li>`).join("");
  sheet.innerHTML=`${pre}
   <p class="hand">концовка</p>
   <h2 class="endtitle">${E.title}</h2>
   <span class="tag ${E.canon?"canon":"alt"}">${E.canon?"так было в фике":"этого в фике не было"}</span>
   ${T.text.map(p=>`<p>${esc(p)}</p>`).join("")}
   <p style="font-size:13px;color:#5b5560">За эту ночь ты тянулся к чужой руке ${times(S.warm)}, сказал правду ${times(S.truth)}, сделал что-то для себя ${times(S.own)}.</p>
   <ul class="log">${log}</ul>
      <div class="savebox"><p style="font-size:13px;margin:0 0 6px"><b>Твой путь сохранён.</b> Следующая часть сама подхватит его на этом устройстве. Если будешь играть на другом, вставь там этот код:</p>
   <code id="code">${code}</code><button class="ghost" id="copy" style="margin-top:8px">Скопировать код</button></div>
   <p style="font-size:13px;margin-top:12px"><a href="../" style="color:inherit">Ко всем частям</a></p>
   <div class="row"><button class="ghost" id="again">Сыграть ещё раз</button><button class="ghost" id="menu">В начало</button></div>`;
  document.getElementById("again").onclick=()=>{S=fresh();go("b1")};
  const cb=document.getElementById("copy");cb.onclick=()=>{
    const done=()=>{cb.textContent="Скопировано"};
    try{navigator.clipboard.writeText(code).then(done,()=>selCode())}catch(e){selCode()}
    function selCode(){const r=document.createRange();r.selectNodeContents(document.getElementById("code"));const sl=getSelection();sl.removeAllRanges();sl.addRange(r);cb.textContent="Код выделен, скопируй его"}
  };
  document.getElementById("menu").onclick=startScreen;
}

const box=(w,h,d,m)=>{const g=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);g.castShadow=true;g.receiveShadow=true;return g};

/* ---------- персонажи (мультяшные: тун-шейдинг, контур, большие головы) ---------- */
const gradTex=(()=>{const d=new Uint8Array([70,150,255]);const t=new THREE.DataTexture(d,3,1,THREE.LuminanceFormat);t.minFilter=t.magFilter=THREE.NearestFilter;t.generateMipmaps=false;t.needsUpdate=true;return t})();
const T=(c,o={})=>new THREE.MeshToonMaterial(Object.assign({color:c,gradientMap:gradTex},o));
const outlineM=new THREE.MeshBasicMaterial({color:0x140f14,side:THREE.BackSide});
function ol(mesh,k=1.07){const o=new THREE.Mesh(mesh.geometry,outlineM);o.scale.setScalar(k);mesh.add(o);mesh.castShadow=true;return mesh}
const sph=(r,m,ws=16,hs=12)=>new THREE.Mesh(new THREE.SphereGeometry(r,ws,hs),m);
function limb(r,len,m,cap=true){
  const g=new THREE.Group();
  const c=ol(new THREE.Mesh(new THREE.CylinderGeometry(r,r*.92,len,14),m),1.09);c.position.y=-len/2;g.add(c);
  if(cap){const e=ol(sph(r*.98,m),1.09);e.position.y=-len;g.add(e);const t=ol(sph(r,m),1.09);g.add(t)}
  return g;
}
const flat=c=>new THREE.MeshBasicMaterial({color:c});
function rig(o){
  const R={root:new THREE.Group()};
  const hips=R.hips=new THREE.Group();R.root.add(hips);hips.position.y=.95;
  const mk=(parent,x,y,z)=>{const g=new THREE.Group();g.position.set(x,y,z);parent.add(g);return g};
  ["L","R"].forEach((s,i)=>{
    const sx=i?-1:1;
    const th=R["th"+s]=mk(hips,.095*sx,0,0);
    th.add(limb(.085,.44,o.legs));
    const kn=R["kn"+s]=mk(th,0,-.46,0);
    kn.add(limb(.075,.4,o.legs,false));
    const shoe=ol(sph(.1,o.shoes),1.08);shoe.scale.set(.9,.6,1.4);shoe.position.set(0,-.44,.05);kn.add(shoe);
  });
  const sp=R.spine=mk(hips,0,0,0);
  const pel=ol(sph(.17*o.w,o.legs),1.06);pel.scale.set(1,.55,.75);pel.position.y=.02;sp.add(pel);
  const tor=ol(new THREE.Mesh(new THREE.CylinderGeometry(.19*o.w,.16*o.w,.5,18),o.torso),1.05);tor.scale.z=.72;tor.position.y=.28;sp.add(tor);
  const sh=ol(sph(.19*o.w,o.torso),1.05);sh.scale.set(1,.5,.72);sh.position.y=.52;sp.add(sh);
  if(o.chest){const ch=new THREE.Mesh(new THREE.BoxGeometry(.1*o.w,.46,.02),o.chest);ch.position.set(0,.3,.118*o.w+.01);sp.add(ch)}
  if(o.coat){
    const cg=new THREE.CylinderGeometry(.23*o.w,.29*o.w,1.0,20,1,true,.5,Math.PI*2-1);
    const coat=new THREE.Mesh(cg,Object.assign(o.coat.clone(),{side:THREE.DoubleSide}));coat.scale.z=.8;coat.position.y=.14;coat.castShadow=true;sp.add(coat);
    const co=new THREE.Mesh(cg,outlineM);co.scale.set(1.04,1.01,1.04);coat.add(co);
    const col=ol(new THREE.Mesh(new THREE.TorusGeometry(.17*o.w,.065,8,18),o.collar||o.coat),1.06);col.rotation.x=Math.PI/2;col.scale.y=.8;col.position.set(0,.6,-.01);sp.add(col);
  }
  const nk=R.neck=mk(sp,0,.6,0);
  const head=ol(sph(.21,o.skin,20,16),1.05);head.scale.set(1,.97,.95);head.position.y=.2;nk.add(head);R.head=head;
  const face=new THREE.Group();face.position.set(0,0,0);head.add(face);
  if(o.eyes==="narrow"){
    [1,-1].forEach(s=>{const e=new THREE.Mesh(new THREE.TorusGeometry(.04,.009,4,12,Math.PI*.8),flat(0x1a1218));e.position.set(.075*s+(s>0?.006:0),.0,.193);e.rotation.z=Math.PI*.1+(s>0?-.08:.08);e.scale.y=.6;face.add(e)});
  }else{
    [1,-1].forEach(s=>{

let curStage=null,walkX=0;
function setStage(name,fireOn){
  const s=ST[name];if(!s) return;
  const envChanged=!curStage||curStage.env!==s.env;curStage=s;walkX=0;
  Object.keys(ENV).forEach(k=>ENV[k].visible=k===s.env);
  fire.visible=!!(s.fire||fireOn);
  if(s.env==="street"&&fire.visible){fire.position.set(0,0,.3)}else fire.position.set(0,0,0);
  Object.entries(CH).forEach(([k,c])=>{
    const a=s.cast[k];
    if(!a){c.root.visible=false;return}
    c.root.visible=true;c.target.set(a[0],0,a[1]);c.targetRy=a[2];
    c.root.position.copy(c.target);c.root.rotation.y=a[2];
    setPose(k,a[3]);
    if(envChanged){c.cur={}}
  });
  naruto.shiver=!!s.shiver;
  if(ENV.home.userData.door) ENV.home.userData.door.intensity=s.door?1.6:0;
  camPosT.set(...s.cam);camLookT.set(...s.look);
  if(envChanged){camPos.copy(camPosT);camLook.copy(camLookT)}
  naruto.setFace(s.face||"sad");tsunade.setFace("neutral");
  cig.visible=true;
}

function resize(){const r=stageEl.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/Math.max(1,r.height);camera.updateProjectionMatrix()}
addEventListener("resize",resize);
new ResizeObserver(resize).observe(stageEl);
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
  Object.values(CH).forEach(c=>{if(c.root.visible)applyPose(c,reduce?0:t,dt)});
  if(curStage&&curStage.walk&&walkX<3.2){walkX+=dt*.45;["naruto","kurama"].forEach(k=>{const a=curStage.cast[k];if(a){CH[k].target.x=a[0]+walkX;CH[k].root.position.x=CH[k].target.x}});camLookT.x=curStage.look[0]+walkX;camPosT.x=curStage.cam[0]+walkX;
    if(walkX>=3.2){setPose("naruto","hold_hand");setPose("kurama","stand")}}
  if(fire.visible){flames.forEach(f=>{f.scale.y=.8+Math.sin(t*8+f.userData.p)*.25+Math.sin(t*19+f.userData.p*3)*.06;f.scale.x=f.scale.z=.9+Math.sin(t*6+f.userData.p)*.1});
    fl1.intensity=2.6+Math.sin(t*13)*.5+Math.sin(t*29)*.25;fl2.intensity=1.8+Math.sin(t*9+1)*.4;
    const pa=embersG.attributes.position;for(let i=0;i<EN;i++){let y=pa.getY(i)+dt*(.4+(i%7)*.08);if(y>3.2)y=0;pa.setY(i,y)}pa.needsUpdate=true}
  if(ENV.shop.visible&&ENV.shop.userData.rec) ENV.shop.userData.rec.rotation.y+=dt*3.5;
  tip.material.color.setHSL(.05,1,.45+Math.sin(t*2)*.1);
  const k=1-Math.pow(.15,dt);camPos.lerp(camPosT,k);camLook.lerp(camLookT,k);
  camera.position.copy(camPos);camera.position.x+=Math.sin(t*.3)*.04;camera.position.y+=Math.sin(t*.23)*.03;camera.lookAt(camLook);
  renderer.render(scene,camera);requestAnimationFrame(loop);
}
